<svg width="1000" height="320" viewBox="0 0 1000 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="320" rx="16" fill="url(#tbg)" stroke="#334155"/>

  <!-- Row 1: Raw Events -->
  <g transform="translate(60, 40)">
    <text x="0" y="24" font-family="-apple-system, sans-serif" font-size="15" fill="#f8fafc" font-weight="700">Raw Events (Fast Clicks)</text>
    <line x1="220" y1="20" x2="880" y2="20" stroke="#475569" stroke-width="2"/>
    <!-- Event dots -->
    <circle cx="260" cy="20" r="7" fill="#ef4444"/>
    <circle cx="290" cy="20" r="7" fill="#ef4444"/>
    <circle cx="320" cy="20" r="7" fill="#ef4444"/>
    <circle cx="350" cy="20" r="7" fill="#ef4444"/>
    <circle cx="480" cy="20" r="7" fill="#ef4444"/>
    <circle cx="510" cy="20" r="7" fill="#ef4444"/>
    <circle cx="680" cy="20" r="7" fill="#ef4444"/>
    <circle cx="710" cy="20" r="7" fill="#ef4444"/>
    <circle cx="740" cy="20" r="7" fill="#ef4444"/>
  </g>

  <!-- Row 2: Throttled (1000ms) -->
  <g transform="translate(60, 130)">
    <text x="0" y="24" font-family="-apple-system, sans-serif" font-size="15" fill="#38bdf8" font-weight="700">Throttled (Interval)</text>
    <line x1="220" y1="20" x2="880" y2="20" stroke="#475569" stroke-width="2"/>
    <!-- Throttled executions -->
    <circle cx="260" cy="20" r="9" fill="#38bdf8"/>
    <text x="260" y="44" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">Execute #1</text>
    
    <circle cx="480" cy="20" r="9" fill="#38bdf8"/>
    <text x="480" y="44" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">Execute #2</text>

    <circle cx="680" cy="20" r="9" fill="#38bdf8"/>
    <text x="680" y="44" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">Execute #3</text>
    <text x="0" y="55" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Guarantees max 1 execution per interval.</text>
  </g>

  <!-- Row 3: Debounced (500ms quiet period) -->
  <g transform="translate(60, 220)">
    <text x="0" y="24" font-family="-apple-system, sans-serif" font-size="15" fill="#a855f7" font-weight="700">Debounced (Quiet Period)</text>
    <line x1="220" y1="20" x2="880" y2="20" stroke="#475569" stroke-width="2"/>
    <!-- Debounced executions after silence -->
    <circle cx="410" cy="20" r="9" fill="#a855f7"/>
    <text x="410" y="44" font-family="monospace" font-size="11" fill="#a855f7" text-anchor="middle">Fire after quiet</text>

    <circle cx="570" cy="20" r="9" fill="#a855f7"/>
    <text x="570" y="44" font-family="monospace" font-size="11" fill="#a855f7" text-anchor="middle">Fire after quiet</text>

    <circle cx="800" cy="20" r="9" fill="#a855f7"/>
    <text x="800" y="44" font-family="monospace" font-size="11" fill="#a855f7" text-anchor="middle">Fire after quiet</text>
    <text x="0" y="55" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Waits until user stops typing or scrolling.</text>
  </g>
</svg>
